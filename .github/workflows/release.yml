# Release: al subir un tag v* (ej. v0.1.0), compila Orion para Windows, macOS y Linux, arma los
# archivos y los publica juntos en una sola release de GitHub.
#   git tag v0.1.0
#   git push origin v0.1.0
# También se puede correr a mano (Actions → Release → Run workflow): arma los archivos y los deja
# como artefactos, sin publicar nada. Sirve para probar.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # para crear la release y subirle archivos

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Que no se publique un v0.2.0 que adentro dice 0.1.0. (La release espera a este job.)
      - name: La versión del tag coincide con Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "El tag ${{ github.ref_name }} no coincide con la versión de Cargo.toml ($version)"
          }

      - name: Tests
        run: cargo test

      - name: Armar el zip
        run: ./scripts/package.ps1

      # En una prueba a mano, queda descargable en la página de la ejecución; con un tag, lo usa "publish".
      - uses: actions/upload-artifact@v4
        with:
          name: orion-windows-x64
          path: target/dist/*.zip*
          if-no-files-found: error

  macos:
    # macos-latest es Apple Silicon; el x86_64 se compila cruzado y lipo une los dos en una app universal.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Armar Orion.app y el zip
        run: ./scripts/package-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orion-macos
          path: target/dist/*.zip*
          if-no-files-found: error

  linux:
    # El binario enlaza la glibc de ubuntu-latest: corre en distribuciones de esa época en adelante.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test

      - name: Armar el tar.gz
        run: ./scripts/package-linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: orion-linux-x64
          path: target/dist/*.tar.gz*
          if-no-files-found: error

  publish:
    # Solo con un tag, y solo si las tres plataformas salieron bien: nunca una release a medias.
    if: github.ref_type == 'tag'
    needs: [windows, macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.tar.gz dist/*.sha256 \
            --repo "${{ github.repository }}" \
            --title "Orion ${{ github.ref_name }}" \
            --generate-notes
