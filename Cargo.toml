[package]
name = "orion"
version = "0.11.0"
edition = "2024"
description = "Una terminal simple para Windows 11, macOS y Linux"
license = "MIT"
repository = "https://github.com/1Bnja/orion"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
# Dibuja con wgpu (DirectX 12 en Windows, Metal en macOS) y OpenGL de respaldo: ver `renderer`.
eframe = { version = "0.37.0", features = ["glow", "wgpu"] }
portable-pty = "0.9.0"
raw-window-handle = "0.6"
# Selector de carpetas nativo para "Nuevo proyecto". En Linux necesita un backend: ver abajo.
rfd = { version = "0.15", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
toml = "1.2.1"
# Decode the Tabler icon PNGs embedded at compile time.
image = { version = "0.25", default-features = false, features = ["png"] }

# Rasterize the home screen logo at the current display scale.
resvg = { version = "0.50.0", default-features = false }

# macOS: la barra de menú del sistema (la de la manzana), con las opciones de Orion.
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# macOS: el material (vibrancy) detrás de la ventana, ver `backdrop`. Las mismas versiones que usa winit.
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAppearance",
    "NSApplication",
    "NSColor",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }

# Solo en Windows: las fuentes instaladas se leen del registro.
[target.'cfg(windows)'.dependencies]
winreg = "0.10"

# Linux: el selector de carpetas por el portal de escritorio (GNOME, KDE, Flatpak), sin enlazar GTK.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# `cargo run` (debug): las dependencias (egui, alacritty_terminal, el parser) se compilan optimizadas.
# Se compilan una sola vez, así que no se nota al recompilar.
[profile.dev.package."*"]
opt-level = 3

# Y nuestro código, un poco: el parser de alacritty_terminal es genérico y se compila *dentro* de Orion,
# con nuestro nivel de optimización. Con 1 sigue compilando rápido y el debugger casi no cambia.
[profile.dev]
opt-level = 1

# Para distribuir: un .exe más chico y algo más rápido, a cambio de compilar más lento.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
