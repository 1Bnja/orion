[package]
name = "orion"
version = "0.1.0"
edition = "2024"
description = "Una terminal simple para Windows 11"
repository = "https://github.com/1Bnja/orion"

[dependencies]
alacritty_terminal = "0.26.0"
base64 = "0.22"
eframe = "0.37.0"
portable-pty = "0.9.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
winreg = "0.10"

# `cargo run` (debug): las dependencias (egui, alacritty, el parser) se compilan optimizadas.
# Se compilan una sola vez, así que no se nota al recompilar.
[profile.dev.package."*"]
opt-level = 3

# Y nuestro código, un poco: el parser de alacritty es genérico y se compila *dentro* de Orion,
# con nuestro nivel de optimización. Con 1 sigue compilando rápido y el debugger casi no cambia.
[profile.dev]
opt-level = 1

# Para distribuir: un .exe más chico y algo más rápido, a cambio de compilar más lento.
[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"
